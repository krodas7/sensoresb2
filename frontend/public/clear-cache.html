<!DOCTYPE html>
<html>
<head>
    <title>Limpiando Caché - Beneficio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 { margin: 0 0 20px 0; }
        .status { font-size: 18px; margin: 20px 0; }
        button {
            padding: 15px 30px;
            font-size: 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Limpieza de Caché</h1>
        <div class="status" id="status">Limpiando service workers y caché...</div>
        <button onclick="clearAndReload()">Limpiar y Recargar</button>
        <button onclick="goToLogin()">Ir al Login</button>
    </div>

    <script>
        async function clearEverything() {
            const status = document.getElementById('status');
            
            // Limpiar Service Workers
            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (let registration of registrations) {
                    await registration.unregister();
                    status.innerHTML += '<br>✅ Service Worker eliminado';
                }
            }
            
            // Limpiar todos los cachés
            if ('caches' in window) {
                const cacheNames = await caches.keys();
                for (let cacheName of cacheNames) {
                    await caches.delete(cacheName);
                    status.innerHTML += '<br>✅ Caché eliminado: ' + cacheName;
                }
            }
            
            // Limpiar localStorage y sessionStorage
            localStorage.clear();
            sessionStorage.clear();
            status.innerHTML += '<br>✅ Storage limpiado';
            
            status.innerHTML += '<br><br>🎉 Todo limpio! Ahora puedes usar el sistema.';
        }
        
        function clearAndReload() {
            clearEverything().then(() => {
                setTimeout(() => window.location.href = '/', 2000);
            });
        }
        
        function goToLogin() {
            window.location.href = '/';
        }
        
        // Auto-limpiar al cargar
        clearEverything();
    </script>
</body>
</html>
