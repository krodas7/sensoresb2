<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Bucles Infinitos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        button {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255,255,255,0.2);
        }
        .success { background: rgba(76, 175, 80, 0.3); }
        .info { background: rgba(33, 150, 243, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛑 Eliminar Bucles Infinitos</h1>
        
        <div class="status info">
            <strong>Problema detectado:</strong><br>
            La página se refresca constantemente debido a bucles infinitos en el frontend.
        </div>

        <button onclick="clearAllAndRestart()">
            🧹 Limpiar Todo y Reiniciar
        </button>

        <div id="status"></div>
    </div>

    <script>
        function log(message, type = 'info') {
            const status = document.getElementById('status');
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = new Date().toLocaleTimeString() + ': ' + message;
            status.appendChild(div);
            console.log(message);
        }

        function clearAllAndRestart() {
            log('🧹 Iniciando limpieza completa...', 'info');
            
            // Limpiar localStorage
            try {
                localStorage.clear();
                log('✅ LocalStorage limpiado', 'success');
            } catch (error) {
                log(`❌ Error limpiando localStorage: ${error.message}`, 'info');
            }

            // Limpiar sessionStorage
            try {
                sessionStorage.clear();
                log('✅ SessionStorage limpiado', 'success');
            } catch (error) {
                log(`❌ Error limpiando sessionStorage: ${error.message}`, 'info');
            }

            // Limpiar Service Workers
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    registrations.forEach(registration => {
                        registration.unregister();
                        log(`✅ Service Worker desregistrado: ${registration.scope}`, 'success');
                    });
                }).catch(error => {
                    log(`❌ Error desregistrando Service Workers: ${error.message}`, 'info');
                });
            }

            // Limpiar Cache Storage
            if ('caches' in window) {
                caches.keys().then(cacheNames => {
                    cacheNames.forEach(name => {
                        caches.delete(name);
                        log(`✅ Cache eliminado: ${name}`, 'success');
                    });
                }).catch(error => {
                    log(`❌ Error eliminando cache: ${error.message}`, 'info');
                });
            }

            log('🎉 Limpieza completada. Redirigiendo...', 'success');
            
            setTimeout(() => {
                window.location.href = '/';
            }, 2000);
        }

        // Auto-ejecutar limpieza al cargar la página
        window.onload = () => {
            setTimeout(() => {
                clearAllAndRestart();
            }, 1000);
        };
    </script>
</body>
</html>
